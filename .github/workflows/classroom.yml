name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Verify Successful Merge
      id: verify-successful-merge
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Verify Successful Merge
        setup-command: ''
        command: git fetch --unshallow origin feature-branch && git merge-base --is-ancestor
          origin/feature-branch HEAD
        timeout: 2
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        VERIFY-SUCCESSFUL-MERGE_RESULTS: "${{steps.verify-successful-merge.outputs.result}}"
      with:
        runners: verify-successful-merge
